version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check (our CI typecheck) refuses TypeScript 7: no peer range for it,
      # and `astro check` exits with an error (closed the TS 7 bump). Remove when
      # @astrojs/check, or its @astrojs/ts-content-mapper replacement, supports it.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      # Astro and its integrations share peer ranges, so a major of one alone fails
      # the peer check. Their majors arrive together as one PR.
      astro-major:
        applies-to: version-updates
        patterns:
          - astro
          - "@astrojs/*"
          - "@keystatic/astro"
        update-types:
          - major
      # One PR a week for routine bumps; other majors still arrive on their own.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
