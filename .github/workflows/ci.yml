name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # match the Vercel project
          cache: npm
      - run: npm ci
      # astro check typechecks .astro, .ts and the config; astro build does not.
      - run: npm run typecheck
      - run: npm run build
